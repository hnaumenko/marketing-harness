<svg xmlns="http://www.w3.org/2000/svg" width="680" height="830" viewBox="0 0 680 830" role="img">
<title>Server-side conversion delivery</title>
<desc>Click ID and consent captured at the edge, outbox in the monolith, relay to Kafka, router, delivery jobs and payout ledger, adapters A, B, C, reconciliation and marketing view.</desc>
<style>text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.th{font-size:14px;font-weight:600;fill:#fff}.ts{font-size:12px;fill:#fff}.lb{font-size:12px;fill:#cbd5e1}.dk{fill:#0b1f1a}.arr{stroke:#9aa4b2;stroke-width:1.5}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9aa4b2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="830" rx="12" fill="#14181f"/>
<rect x="40" y="30" width="180" height="56" rx="6" fill="#53f0cd"/><text class="th dk" x="130.0" y="48" text-anchor="middle" dominant-baseline="central">Landing + edge</text><text class="ts dk" x="130.0" y="68" text-anchor="middle" dominant-baseline="central">attr_sid cookie, CMP</text>
<rect x="250" y="30" width="170" height="56" rx="6" fill="#53f0cd"/><text class="th dk" x="335.0" y="48" text-anchor="middle" dominant-baseline="central">Touchpoints</text><text class="ts dk" x="335.0" y="68" text-anchor="middle" dominant-baseline="central">append-only, 90 days</text>
<rect x="450" y="30" width="190" height="56" rx="6" fill="#4b5563"/><text class="th" x="545.0" y="48" text-anchor="middle" dominant-baseline="central">GTM pixel</text><text class="ts" x="545.0" y="68" text-anchor="middle" dominant-baseline="central">same event_id → A</text>
<line x1="220" y1="58" x2="248" y2="58" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="130" width="180" height="56" rx="6" fill="#4b5563"/><text class="th" x="130.0" y="148" text-anchor="middle" dominant-baseline="central">PHP monolith</text><text class="ts" x="130.0" y="168" text-anchor="middle" dominant-baseline="central">reg, FTD, chargeback</text>
<rect x="250" y="130" width="170" height="56" rx="6" fill="#53f0cd"/><text class="th dk" x="335.0" y="148" text-anchor="middle" dominant-baseline="central">conversion_outbox</text><text class="ts dk" x="335.0" y="168" text-anchor="middle" dominant-baseline="central">same transaction</text>
<line x1="130" y1="88" x2="130" y2="128" class="arr" marker-end="url(#arrow)"/>
<text class="lb" x="140" y="110">attr_sid cookie</text>
<line x1="220" y1="158" x2="248" y2="158" class="arr" marker-end="url(#arrow)"/>
<path d="M420 158 L545 158 L545 90" fill="none" class="arr" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text class="lb" x="452" y="146">event_id</text>
<path d="M420 72 L437 72 L437 228" fill="none" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="230" width="140" height="56" rx="6" fill="#53f0cd"/><text class="th dk" x="110.0" y="248" text-anchor="middle" dominant-baseline="central">Outbox relay</text><text class="ts dk" x="110.0" y="268" text-anchor="middle" dominant-baseline="central">poll every 1 s</text>
<rect x="210" y="230" width="140" height="56" rx="6" fill="#4b5563"/><text class="th" x="280.0" y="248" text-anchor="middle" dominant-baseline="central">Kafka</text><text class="ts" x="280.0" y="268" text-anchor="middle" dominant-baseline="central">key = user_id</text>
<rect x="380" y="230" width="260" height="56" rx="6" fill="#53f0cd"/><text class="th dk" x="510.0" y="248" text-anchor="middle" dominant-baseline="central">Router</text><text class="ts dk" x="510.0" y="268" text-anchor="middle" dominant-baseline="central">stitch, consent, routing</text>
<path d="M335 188 L335 208 L110 208 L110 228" fill="none" class="arr" marker-end="url(#arrow)"/>
<line x1="180" y1="258" x2="208" y2="258" class="arr" marker-end="url(#arrow)"/>
<line x1="350" y1="258" x2="378" y2="258" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="330" width="400" height="56" rx="6" fill="#53f0cd"/><text class="th dk" x="240.0" y="348" text-anchor="middle" dominant-baseline="central">delivery_jobs</text><text class="ts dk" x="240.0" y="368" text-anchor="middle" dominant-baseline="central">UNIQUE(event_id, network), states, reasons</text>
<rect x="470" y="330" width="170" height="56" rx="6" fill="#53f0cd"/><text class="th dk" x="555.0" y="348" text-anchor="middle" dominant-baseline="central">Payout ledger</text><text class="ts dk" x="555.0" y="368" text-anchor="middle" dominant-baseline="central">one FTD per user</text>
<line x1="410" y1="288" x2="410" y2="328" class="arr" marker-end="url(#arrow)"/>
<line x1="555" y1="288" x2="555" y2="328" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="430" width="180" height="56" rx="6" fill="#53f0cd"/><text class="th dk" x="130.0" y="448" text-anchor="middle" dominant-baseline="central">Adapter A</text><text class="ts dk" x="130.0" y="468" text-anchor="middle" dominant-baseline="central">micro-batch, ≤80/min</text>
<rect x="250" y="430" width="180" height="56" rx="6" fill="#53f0cd"/><text class="th dk" x="340.0" y="448" text-anchor="middle" dominant-baseline="central">Adapter B</text><text class="ts dk" x="340.0" y="468" text-anchor="middle" dominant-baseline="central">no blind retries</text>
<rect x="460" y="430" width="180" height="56" rx="6" fill="#53f0cd"/><text class="th dk" x="550.0" y="448" text-anchor="middle" dominant-baseline="central">Adapter C</text><text class="ts dk" x="550.0" y="468" text-anchor="middle" dominant-baseline="central">breaker, reversals</text>
<line x1="130" y1="388" x2="130" y2="428" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="388" x2="340" y2="428" class="arr" marker-end="url(#arrow)"/>
<path d="M430 388 L430 408 L510 408 L510 428" fill="none" class="arr" marker-end="url(#arrow)"/>
<line x1="590" y1="388" x2="590" y2="428" class="arr" marker-end="url(#arrow)"/>
<rect x="40" y="540" width="180" height="56" rx="6" fill="#4b5563"/><text class="th" x="130.0" y="558" text-anchor="middle" dominant-baseline="central">Network A</text><text class="ts" x="130.0" y="578" text-anchor="middle" dominant-baseline="central">batch, dedup 48 h</text>
<rect x="250" y="540" width="180" height="56" rx="6" fill="#4b5563"/><text class="th" x="340.0" y="558" text-anchor="middle" dominant-baseline="central">Network B</text><text class="ts" x="340.0" y="578" text-anchor="middle" dominant-baseline="central">1 event, no dedup</text>
<rect x="460" y="540" width="180" height="56" rx="6" fill="#4b5563"/><text class="th" x="550.0" y="558" text-anchor="middle" dominant-baseline="central">Network C</text><text class="ts" x="550.0" y="578" text-anchor="middle" dominant-baseline="central">GET postback, outages</text>
<line x1="130" y1="488" x2="130" y2="538" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="488" x2="340" y2="538" class="arr" marker-end="url(#arrow)"/>
<line x1="550" y1="488" x2="550" y2="538" class="arr" marker-end="url(#arrow)"/>
<rect x="250" y="640" width="180" height="56" rx="6" fill="#53f0cd"/><text class="th dk" x="340.0" y="658" text-anchor="middle" dominant-baseline="central">Reconciliation</text><text class="ts dk" x="340.0" y="678" text-anchor="middle" dominant-baseline="central">result → delivery_jobs</text>
<rect x="460" y="640" width="180" height="56" rx="6" fill="#53f0cd"/><text class="th dk" x="550.0" y="658" text-anchor="middle" dominant-baseline="central">Marketing view</text><text class="ts dk" x="550.0" y="678" text-anchor="middle" dominant-baseline="central">accepted / rejected</text>
<line x1="300" y1="598" x2="300" y2="638" class="arr" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<path d="M600 598 L600 618 L400 618 L400 638" fill="none" class="arr" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<path d="M40 372 L22 372 L22 716 L550 716 L550 698" fill="none" class="arr" marker-end="url(#arrow)"/>
<text class="lb" x="40" y="668">dashed = network reports</text>
<rect x="40" y="740" width="14" height="14" rx="3" fill="#53f0cd"/>
<text class="lb" x="62" y="751">new service</text>
<rect x="170" y="740" width="14" height="14" rx="3" fill="#4b5563"/>
<text class="lb" x="192" y="751">existing or external</text>
<text class="lb" x="40" y="782">Kill-switch per network. Rollout: shadow → A → C → B.</text>
<text class="lb" x="40" y="802">Pixel for B and FTD pixel for C: marketing decides (README, section 7).</text>
</svg>
